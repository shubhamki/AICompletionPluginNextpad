name: macOS plugin checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Public source privacy checks
        run: python3 scripts/privacy_check.py
      - name: Verify vendored files
        run: shasum -a 256 -c vendor/SHA256SUMS
      - name: Build universal plugin
        run: bash scripts/build.sh
      - name: Core and ABI checks
        run: bash scripts/test.sh
      - name: Synthetic HTTP checks
        run: python3 tests/http_fixture.py
      - name: Verify code signature
        run: codesign --verify --strict build/WritingAssistant/WritingAssistant.dylib
